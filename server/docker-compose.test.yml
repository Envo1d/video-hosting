services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: video_hosting_test
    ports:
      - '127.0.0.1:16500:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d video_hosting_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

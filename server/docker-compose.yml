version: '3'
services:
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - '6500:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - ./.env
    command: ["postgres", "-c", "log_statement=all"]

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redisDB:/data
volumes:
  postgres_data:
  redisDB:


